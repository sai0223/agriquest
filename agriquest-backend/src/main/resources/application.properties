spring.application.name=agriquest-backend

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/agriquest
spring.datasource.username=postgres
spring.datasource.password=praneeth777
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=AgriQuestPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Server
server.port=8080

# Logging
logging.level.com.agriquest=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
